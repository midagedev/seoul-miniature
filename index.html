<body class="look2">
<canvas id="c" aria-label="경복궁과 주변 서울 도심의 픽셀아트 미니어처"></canvas>
<div id="vignette"></div>

<header id="title">
  <div class="eyebrow">SEOUL · MINIATURE</div>
  <h1>경복궁, 살아 있는 미니어처</h1>
  <p id="caption">드래그로 이동 · 휠로 확대</p>
</header>

<nav id="maps" aria-label="지도 고르기"></nav>
<nav id="places" aria-label="장소 바로가기"></nav>

<section id="dock" aria-label="시간과 계절">
  <button id="play" class="icon" title="시간 흐름 켜기/끄기" aria-pressed="true"></button>
  <div id="clock">09:00</div>
  <input id="tod" type="range" min="0" max="24" step="0.01" value="9" aria-label="시각">
  <div id="seasons" role="group" aria-label="계절">
    <button data-s="0">봄</button><button data-s="1" class="on">여름</button><button data-s="2">가을</button><button data-s="3">겨울</button>
  </div>
  <button id="rain" class="chip" aria-pressed="false">비</button>
  <button id="clouds" class="chip" aria-pressed="true" title="흐르는 구름 그림자 켜기/끄기">구름</button>
  <button id="tilt" class="chip" aria-pressed="true" title="위·아래 가장자리를 흐리게(미니어처 사진 느낌)">미니어처</button>
  <button id="look" class="chip" aria-pressed="true" title="눌림 = 세련된 픽셀아트(기본), 해제 = 예전 룩">룩</button>
  <button id="tour" class="primary">둘러보기</button>
</section>

<footer id="foot">
  <button id="about">출처<span class="w"> · 라이선스</span></button>
  <button id="verify">검증 도구</button>
  <a id="gh" class="btn" href="https://github.com/midagedev/seoul-miniature" target="_blank" rel="noopener" title="소스 코드와 만든 과정 (GitHub)" aria-label="GitHub 저장소"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span class="w">GitHub</span></a>
  <button id="share" title="지금 보는 위치·계절을 담은 주소 복사">링크 복사</button>
  <button id="snap" title="지금 화면을 그림으로 저장·공유(버튼 없이, 아래에 출처 표기)">캡처</button>
  <button id="finds" title="가까이서 만난 장면 목록">찾아보기</button>
  <button id="sound" title="배경음 켜기/끄기" aria-pressed="false" hidden><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path class="wave" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="mute" d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>소리</button>
  <span id="notice">지도 데이터 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a><span class="more"> · Overture Maps · 국토교통부 · 국가유산청(공공누리 1유형)</span><span class="etc"> 외 · 자세히는 「출처」</span></span>
</footer>

<aside id="hud" hidden></aside>

<div id="panel" hidden>
  <div class="card">
    <button class="close" aria-label="닫기">×</button>
    <div id="panel-body"></div>
  </div>
</div>

<div id="loading"><div class="bar"><i></i></div><p>미니어처를 펼치는 중…</p></div>
